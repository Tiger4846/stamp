services:
  db:
    image: postgres:17.6
    container_name: stamp_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgre_data:/var/lib/postgresql/data
    ports:
        - "5485:5432"
    networks:
      - postgres_network

volumes:
  postgre_data:

networks:
  postgres_network:
    driver: bridge